# Self-contained sync server binaries for macOS (arm64, x64) and Windows (x64), built with vcpkg's static libraries
# (packaging/vcpkg) and tested on their own runners. Each one is packed like the Linux binary (Dockerfile.static):
#
#   openvireo-sync-server-<version>-darwin-arm64.tar.gz
#   openvireo-sync-server-<version>-darwin-x64.tar.gz
#   openvireo-sync-server-<version>-windows-x64.zip
#
# and uploaded as the artifact binary-<os>-<arch>, which release.yml attaches to the GitHub release. This workflow
# publishes nothing itself, so it can be started on any branch:
#
#   gh workflow run binaries-native.yml --ref <branch>
#
# The binaries are signed before they're packed (.github/RELEASE-SIGNING.md): macOS with the Developer ID, hardened
# runtime and notarization, Windows with Azure Artifact Signing. The secrets live in the `signing` environment, which
# the build uses only for a v* tag or with the `sign` input. A tag fails without them; elsewhere signing is skipped
# with a warning.

name: Native binaries

on:
  workflow_call:
    inputs:
      version:
        description: Version in the archive names; default the tag without its v, or sha-<commit>
        type: string
        required: false
        default: ""
      sign:
        description: Sign the binaries (needs a `signing` environment that allows this branch); always on for a v* tag
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: Version in the archive names; default the tag without its v, or sha-<commit>
        type: string
        required: false
        default: ""
      sign:
        description: Sign the binaries (needs a `signing` environment that allows this branch); always on for a v* tag
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  # The vcpkg tool and scripts; the ports come from the baseline in packaging/vcpkg/vcpkg-configuration.json
  VCPKG_COMMIT: d90cb72e90dc7ce9a38ee77c4cafa398a4e6a800
  # Keep in step with VCPKG_OSX_DEPLOYMENT_TARGET in packaging/vcpkg/triplets and docs/install.md
  MACOSX_DEPLOYMENT_TARGET: "13.3"
  # Signing is required on a release tag and when asked for; it's skipped with a warning otherwise
  REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.sign == true }}
  # Pinned download; update the version and checksum together (the same as the desktop app's build.yml)
  ARTIFACT_SIGNING_CLIENT_VERSION: "1.0.146"
  ARTIFACT_SIGNING_CLIENT_SHA256: 7761e5d8f31e54b764da21d33cd8b0a2940e1b05526c7dfcb5e94b0431426f70

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-15
            triplet: arm64-osx-release-static
          - os: darwin
            arch: x64
            runner: macos-15-intel
            triplet: x64-osx-release-static
          - os: windows
            arch: x64
            runner: windows-2025
            triplet: x64-windows-release-static
    runs-on: ${{ matrix.runner }}
    # The signing secrets; release.yml passes them on with `secrets: inherit`
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.sign) && 'signing' || '' }}
    permissions:
      contents: read
      id-token: write # azure/login with the federated credential for the signing environment (Windows)
    defaults:
      run:
        shell: bash
    env:
      HAS_SIGNING_SECRETS: ${{ matrix.os == 'darwin' && (secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '') || matrix.os == 'windows' && (secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' && vars.ARTIFACT_SIGNING_ENDPOINT != '' && vars.ARTIFACT_SIGNING_ACCOUNT != '' && vars.ARTIFACT_SIGNING_PROFILE != '') }}
    steps:
      - uses: actions/checkout@v5

      - name: Name the version
        run: |
          v="$INPUT_VERSION"
          if [[ -z "$v" && "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; fi
          if [[ -z "$v" ]]; then v="sha-${GITHUB_SHA::7}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "PACKAGE=openvireo-sync-server-$v" >> "$GITHUB_ENV"
          # vcpkg and CMake want C:/... rather than C:\... or /c/...
          tmp="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == Windows ]]; then tmp="$(cygpath -m "$RUNNER_TEMP")"; fi
          echo "VCPKG_ROOT=$tmp/vcpkg" >> "$GITHUB_ENV"
          # Built packages, cached below
          echo "VCPKG_BINARY_SOURCES=clear;files,$tmp/vcpkg-cache,readwrite" >> "$GITHUB_ENV"
          mkdir -p "$tmp/vcpkg-cache"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      # vcpkg's Meson (for libpq) needs Python 3.10 or later
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up vcpkg
        run: |
          git init -q "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch -q --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_COMMIT"
          git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD
          if [[ "$RUNNER_OS" == Windows ]]; then "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics; else "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics; fi

      # Built packages, so only a change of the ports, triplets or vcpkg rebuilds Drogon, OpenSSL and libpq
      - name: Restore the vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('packaging/vcpkg/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('packaging/vcpkg/**') }}-
            vcpkg-${{ matrix.triplet }}-

      - name: Configure
        id: configure
        run: |
          args=(-DCMAKE_BUILD_TYPE=Release
                -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
                -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE/packaging/vcpkg"
                -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
                -DVCPKG_INSTALL_OPTIONS=--clean-after-build
                -DSYNC_SERVER_WITH_CLOUD=ON
                -DSYNC_SERVER_PORTABLE=ON)
          if [[ "$RUNNER_OS" == macOS ]]; then
            # Homebrew's libraries mustn't end up in the binary
            args+=(-DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" "-DCMAKE_IGNORE_PREFIX_PATH=/opt/homebrew;/usr/local")
          else
            # The C++ runtime linked in (/MT), like the vcpkg triplet's libraries
            args+=(-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded)
          fi
          before=$(find "$VCPKG_ROOT/../vcpkg-cache" -type f | wc -l)
          cmake -S . -B build "${args[@]}"
          if [[ "$(find "$VCPKG_ROOT/../vcpkg-cache" -type f | wc -l)" != "$before" ]]; then echo "VCPKG_BUILT=1" >> "$GITHUB_ENV"; fi

      # Only when vcpkg built something, and also after a failed configure, which keeps what was built before it failed
      - name: Save the vcpkg packages
        if: always() && (env.VCPKG_BUILT == '1' || steps.configure.outcome == 'failure')
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('packaging/vcpkg/**') }}-${{ github.run_id }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run the tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release --prefix out $([[ "$RUNNER_OS" == macOS ]] && echo --strip)

      - name: Check that the binary needs only system libraries
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            bin=out/bin/openvireo-sync-server
            otool -L "$bin"
            if otool -L "$bin" | tail -n +2 | grep -vE '^\s+(/usr/lib/|/System/Library/)'; then
              echo "::error::links a library outside the system" && exit 1
            fi
            vtool -show-build "$bin"
          else
            bin=out/bin/openvireo-sync-server.exe
            dumpbin="$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' \
              -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | head -n 1 | tr -d '\r')"
            "$dumpbin" -nologo -dependents "$bin" | tee dependents.txt
            if grep -iE 'vcruntime|msvcp|ucrtbase|api-ms-win-crt|ssl|crypto|libpq|sqlite|zlib|brotli|cares|jsoncpp|drogon|trantor' dependents.txt; then
              echo "::error::links a DLL that isn't part of Windows" && exit 1
            fi
          fi

      # Signs out/bin/openvireo-sync-server(.exe) in place, so Package and the smoke test below use the signed file
      - name: Check the signing secrets
        id: signing
        run: |
          if [[ "$HAS_SIGNING_SECRETS" == true ]]; then echo "signed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [[ "$RUNNER_OS" == macOS ]]; then
            what="macOS signing (secrets MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD)"
          else
            what="Windows signing (secrets AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and variables ARTIFACT_SIGNING_ENDPOINT, ARTIFACT_SIGNING_ACCOUNT, ARTIFACT_SIGNING_PROFILE)"
          fi
          if [[ "$REQUIRE_SIGNING" == true ]]; then
            echo "::error::$what is not configured in the signing environment; see .github/RELEASE-SIGNING.md"
            exit 1
          fi
          echo "::warning::Signing skipped: no signing secrets here; the ${{ matrix.os }} binary is not signed"
          echo "signed=false" >> "$GITHUB_OUTPUT"

      - name: Import the signing certificate (macOS)
        id: identity
        if: runner.os == 'macOS' && steps.signing.outputs.signed == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application/ { print $2; exit }')
          if [[ -z "$identity" ]]; then echo "::error::MACOS_CERTIFICATE_P12 has no Developer ID Application identity"; exit 1; fi
          xcrun notarytool store-credentials notarization --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && steps.signing.outputs.signed == 'true'
        env:
          NOTARY_PROFILE: notarization
          NOTARY_KEYCHAIN: ${{ steps.identity.outputs.keychain }}
        run: .github/scripts/sign-macos.sh out/bin/openvireo-sync-server "${{ steps.identity.outputs.identity }}"

      # Without signing secrets: a throwaway self-signed signature on a copy, to check a signed binary still runs
      - name: Check a signed copy still runs (Windows)
        if: runner.os == 'Windows' && steps.signing.outputs.signed == 'false'
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=OpenVireo CI test" -CertStoreLocation Cert:\CurrentUser\My
          $exe = Join-Path $env:RUNNER_TEMP "openvireo-sync-server-test.exe"
          Copy-Item out\bin\openvireo-sync-server.exe $exe
          $before = (Get-Item $exe).Length
          Set-AuthenticodeSignature -FilePath $exe -Certificate $cert -HashAlgorithm SHA256 | Out-Null
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.SignerCertificate.Thumbprint -ne $cert.Thumbprint) { throw "the test signature is missing" }
          "signed copy: $before -> $((Get-Item $exe).Length) bytes, status $($sig.Status) (untrusted test certificate)"
          $env:SYNC_DATA_DIR = Join-Path $env:RUNNER_TEMP "signed-copy-data"
          & $exe users list
          if ($LASTEXITCODE) { throw "the signed copy failed to run" }

      # Signs in only now, after the long vcpkg build, so the OIDC login is fresh and needs no refresh
      - name: Sign in to Azure (Windows)
        if: runner.os == 'Windows' && steps.signing.outputs.signed == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Artifact Signing (Windows)
        id: dlib
        if: runner.os == 'Windows' && steps.signing.outputs.signed == 'true'
        env:
          ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          # SignTool's dlib for Artifact Signing; it signs with the Azure CLI login from the previous step
          curl -fsSL -o "$RUNNER_TEMP/signing-client.nupkg" \
            "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$ARTIFACT_SIGNING_CLIENT_VERSION/microsoft.artifactsigning.client.$ARTIFACT_SIGNING_CLIENT_VERSION.nupkg"
          echo "$ARTIFACT_SIGNING_CLIENT_SHA256  $RUNNER_TEMP/signing-client.nupkg" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/signing-client.nupkg" -d "$RUNNER_TEMP/signing-client"
          python - "$RUNNER_TEMP/signing-metadata.json" <<'EOF'
          import json, os, sys
          excluded = ["EnvironmentCredential", "ManagedIdentityCredential", "WorkloadIdentityCredential",
                      "SharedTokenCacheCredential", "VisualStudioCredential", "VisualStudioCodeCredential",
                      "AzurePowerShellCredential", "AzureDeveloperCliCredential", "InteractiveBrowserCredential"]
          json.dump({"Endpoint": os.environ["ENDPOINT"], "CodeSigningAccountName": os.environ["ACCOUNT"],
                     "CertificateProfileName": os.environ["PROFILE"], "ExcludeCredentials": excluded},
                    open(sys.argv[1], "w"), indent=2)
          EOF
          echo "dlib=$(cygpath -w "$RUNNER_TEMP/signing-client/bin/x64/Azure.CodeSigning.Dlib.dll")" >> "$GITHUB_OUTPUT"
          echo "metadata=$(cygpath -w "$RUNNER_TEMP/signing-metadata.json")" >> "$GITHUB_OUTPUT"

      - name: Sign (Windows)
        if: runner.os == 'Windows' && steps.signing.outputs.signed == 'true'
        shell: pwsh
        env:
          DLIB: ${{ steps.dlib.outputs.dlib }}
          METADATA: ${{ steps.dlib.outputs.metadata }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          $exe = (Get-Item out\bin\openvireo-sync-server.exe).FullName
          & $signtool.FullName sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 `
            /dlib $env:DLIB /dmdf $env:METADATA $exe
          if ($LASTEXITCODE) { throw "signtool failed" }
          $sig = Get-AuthenticodeSignature $exe
          "$exe`: $($sig.Status), $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { throw "$exe has no valid signature" }

      - name: Package
        run: |
          mkdir -p "pkg/$PACKAGE" dist
          cp out/bin/* LICENSE README.md "pkg/$PACKAGE/"
          cp -R docs "pkg/$PACKAGE/docs"
          name="$PACKAGE-${{ matrix.os }}-${{ matrix.arch }}"
          if [[ "$RUNNER_OS" == Windows ]]; then
            (cd pkg && python -m zipfile -c "../dist/$name.zip" "$PACKAGE")
          else
            tar -C pkg -czf "dist/$name.tar.gz" "$PACKAGE"
          fi
          ls -l dist out/bin

      - name: Run the packaged binary
        run: .github/scripts/smoke-test.sh dist/*
        env:
          PYTHON: python

      - name: Check the signature in the archive
        run: |
          mkdir check
          if [[ "$RUNNER_OS" == Windows ]]; then python -m zipfile -e dist/*.zip check; else tar -xzf dist/*.tar.gz -C check; fi
          if [[ "$SIGNED" != true ]]; then echo "::warning::The ${{ matrix.os }} binary is not signed (signing was skipped)"; exit 0; fi
          if [[ "$RUNNER_OS" == macOS ]]; then
            bin=$(ls check/*/openvireo-sync-server)
            codesign --verify --strict --verbose=2 "$bin"
            info=$(codesign -dvv "$bin" 2>&1)
            echo "$info" | grep -E '^(Identifier=|CodeDirectory |Authority=|TeamIdentifier=|Timestamp=)'
            [[ "$info" == *"Authority=Developer ID Application:"* ]] || { echo "::error::not signed with a Developer ID"; exit 1; }
            [[ "$info" == *"flags="*"runtime"* ]] || { echo "::error::no hardened runtime"; exit 1; }
            # Notarized: Gatekeeper finds the ticket online (a bare executable can't be stapled)
            assessment=$(spctl --assess --type install -vv "$bin" 2>&1) || { echo "$assessment"; exit 1; }
            echo "$assessment"
            [[ "$assessment" == *"source=Notarized Developer ID"* ]] || { echo "::error::not notarized"; exit 1; }
          else
            pwsh -NoProfile -Command '
              $f = (Get-ChildItem check\*\openvireo-sync-server.exe).FullName
              $sig = Get-AuthenticodeSignature $f
              "$f`: $($sig.Status), $($sig.SignerCertificate.Subject), timestamp by $($sig.TimeStamperCertificate.Subject)"
              if ($sig.Status -ne "Valid") { exit 1 }'
          fi
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
