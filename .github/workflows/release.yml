# Builds the runtime image for linux/amd64 and linux/arm64 and publishes it to GHCR when a version tag is pushed:
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# publishes ghcr.io/openvireo/openvireo-sync-server:1.2.3, :1.2, :1 and :latest (a pre-release such as v1.3.0-rc.1
# gets only its own tag), then creates the GitHub release with statically linked binaries for Linux x64 and arm64
# (Dockerfile.static) and their SHA256SUMS. The API tests run first, also against the static build, and a failure stops
# the release. Each architecture builds on its own native runner, since compiling Drogon under emulation takes far too long.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Re-runs a release when started from a tag; from a branch it publishes only a sha-<commit> tag
  workflow_dispatch:

permissions:
  contents: read

env:
  # Image names must be lowercase, which github.repository (OpenVireo/...) is not
  IMAGE: ghcr.io/openvireo/openvireo-sync-server

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: openvireo-sync-server-test
          # Shares the Drogon and build layers with the amd64 image build
          cache-from: type=gha,scope=linux-amd64
      - name: Run the API tests
        run: docker run --rm openvireo-sync-server-test

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Name the platform
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: actions/checkout@v5
      - name: Image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed untagged; the merge job tags the multi-platform index
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max
      - name: Export the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        env:
          # GHCR reads the description and source repository from the index's annotations
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha
      - name: Create and push the multi-platform index
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
      - name: Inspect the image
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
        env:
          VERSION: ${{ steps.meta.outputs.version }}

  # The static binary: the API tests run against it inside the build, then it's packed with the docs and systemd unit
  binaries:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Name the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="sha-${GITHUB_SHA::7}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Run the API tests against the static build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.static
          target: test
          cache-from: type=gha,scope=static-linux-${{ matrix.arch }}
          cache-to: type=gha,scope=static-linux-${{ matrix.arch }},mode=max
      - name: Build the archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.static
          build-args: VERSION=${{ env.VERSION }}
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=static-linux-${{ matrix.arch }}
      - name: Run it on another distribution
        run: |
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP"
          docker run --rm -v "$RUNNER_TEMP/openvireo-sync-server-$VERSION:/x:ro" -w /tmp fedora:41 \
            sh -c '/x/openvireo-sync-server & sleep 2; curl -fsS http://127.0.0.1:8787/api/v1/health'
      - uses: actions/upload-artifact@v4
        with:
          name: binary-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # The GitHub release, with notes generated from the changes since the previous tag
  release:
    needs: [merge, binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # GPG_PRIVATE_KEY lives in this environment, which only allows v* tags (.github/RELEASE-SIGNING.md)
    environment: signing
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: binary-*
          merge-multiple: true
      - name: Checksums
        working-directory: binaries
        run: sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Sign the checksums
        working-directory: binaries
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          # The OpenVireo release key (primary key); the secret holds its signing subkey
          RELEASE_KEY: 23F6403E9392E946475E7FD3B55683A43E98C11C
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY is not set in the signing environment; see .github/RELEASE-SIGNING.md"
            exit 1
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          # VALIDSIG's last field is the primary key of the subkey that signed
          primary=$(gpg --batch --status-fd 1 --verify SHA256SUMS.asc SHA256SUMS 2>/dev/null | awk '$2 == "VALIDSIG" { print $NF }')
          if [ "$primary" != "$RELEASE_KEY" ]; then
            echo "::error::SHA256SUMS.asc is signed by a key of $primary, not the release key $RELEASE_KEY"; exit 1
          fi
      - name: Create the release, or replace the binaries on a re-run
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" binaries/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          args=(--repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --verify-tag --generate-notes)
          if [[ "$version" == *-* ]]; then args+=(--prerelease); fi
          printf '```sh\ndocker pull %s:%s\n```\n\nOr the static Linux binary (x64, arm64), with a systemd unit; see docs/install.md:\n\n```sh\ncurl -LO https://github.com/%s/releases/download/%s/openvireo-sync-server-%s-linux-x64.tar.gz\n```\n\n`SHA256SUMS.asc` is a GPG signature of `SHA256SUMS` by the [OpenVireo release key](https://openvireo.com/verifying-signatures) (`23F6 403E 9392 E946 475E 7FD3 B556 83A4 3E98 C11C`).\n' \
            "$IMAGE" "$version" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$version" > notes.md
          gh release create "$GITHUB_REF_NAME" "${args[@]}" --notes-file notes.md binaries/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
