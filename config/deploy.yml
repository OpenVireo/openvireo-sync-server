# Kamal deploy of the sync server to the shared OpenVireo droplet (DigitalOcean nyc3), in the stateless
# setup: managed Postgres over the VPC and the openvireo-sync Spaces bucket. The account server and the
# web app are separate Kamal apps on the same droplet, behind the same kamal-proxy.
#
#   kamal setup     # first time
#   kamal deploy    # every time after
#
# The instances apply the schema when they start, under a lock. Secrets are in .kamal/secrets, which is
# not in git; .kamal/secrets.example lists them.

service: openvireo-sync
image: bongani-m/openvireo-sync-server

servers:
  web:
    hosts:
      - 134.122.2.127

proxy:
  host: sync.openvireo.com
  ssl: true
  app_port: 8787
  healthcheck:
    path: /api/v1/health
  # GET /api/v1/events is server-sent events, held open with a ping every 25 seconds.
  response_timeout: 3600

registry:
  server: registry.digitalocean.com
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

# Built on the droplet, which is amd64, so Apple Silicon doesn't have to emulate the C++ build.
builder:
  arch: amd64
  remote: ssh://root@134.122.2.127

env:
  clear:
    SYNC_BEHIND_PROXY: 1
    SYNC_THREADS: 2
    SYNC_S3_ENDPOINT: https://nyc3.digitaloceanspaces.com
    SYNC_S3_REGION: nyc3
    SYNC_S3_BUCKET: openvireo-sync
    SYNC_AUTH_MODE: jwt
    SYNC_AUTH_JWKS_URL: https://accounts.openvireo.com/.well-known/jwks.json
    SYNC_AUTH_ISSUER: https://accounts.openvireo.com
    SYNC_ALLOWED_ORIGINS: https://app.openvireo.com
    # Raised in steps: max-age=300, then 604800 with includeSubDomains, then a year with preload.
    SYNC_HSTS: max-age=300
  secret:
    - SYNC_DATABASE_URL
    - SYNC_S3_ACCESS_KEY
    - SYNC_S3_SECRET_KEY
    - SYNC_INTERNAL_TOKEN

aliases:
  sync: app exec --primary --reuse "openvireo-sync-server"
